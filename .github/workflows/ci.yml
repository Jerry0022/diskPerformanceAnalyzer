name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DiskPerformanceAnalyzer.sln

      - name: Build
        run: dotnet build DiskPerformanceAnalyzer.sln -c Release --no-restore

      - name: Test
        run: dotnet test DiskPerformanceAnalyzer.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish smoke test (single-file, self-contained)
        run: >
          dotnet publish src/DiskPerformanceAnalyzer -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # The Linux data layer against a real kernel: /proc/diskstats + tracefs need root.
      - name: Probe (Linux, root)
        if: runner.os == 'Linux'
        run: sudo ./publish/DiskPerformanceAnalyzer --probe 3
