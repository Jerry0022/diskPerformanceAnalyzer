name: Release

# Pushing a tag like v1.2.3 builds self-contained single-file binaries for win-x64 and
# linux-x64 and attaches them (plus archives and checksums) to a GitHub Release with
# auto-generated notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test DiskPerformanceAnalyzer.sln -c Release

      - name: Publish ${{ matrix.rid }} (single file, self-contained)
        run: >
          dotnet publish src/DiskPerformanceAnalyzer -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/DiskPerformanceAnalyzer.exe "dist/DiskPerformanceAnalyzer-$v-win-x64.exe"
          Compress-Archive -Path publish/* -DestinationPath "dist/DiskPerformanceAnalyzer-$v-win-x64.zip"
          Get-ChildItem dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir dist
          chmod +x publish/DiskPerformanceAnalyzer
          sudo ./publish/DiskPerformanceAnalyzer --probe 2   # the data layer against the runner's kernel
          cp publish/DiskPerformanceAnalyzer "dist/DiskPerformanceAnalyzer-$v-linux-x64"
          tar -C publish -czf "dist/DiskPerformanceAnalyzer-$v-linux-x64.tar.gz" .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Disk Performance Analyzer $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**Windows:** download \`DiskPerformanceAnalyzer-$v-win-x64.exe\`, run it (asks for admin — needed for the kernel I/O trace). **Linux:** download \`DiskPerformanceAnalyzer-$v-linux-x64\`, \`chmod +x\` it, run it (asks for root via pkexec — needed for tracefs; without root the disks are still shown, just without the process table). No install, no .NET runtime required. Windows 10/11 x64 · Linux x64 (glibc, X11/Wayland)."
