name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DiskPerformanceAnalyzer.sln

      - name: Build
        run: dotnet build DiskPerformanceAnalyzer.sln -c Release --no-restore

      - name: Test
        run: dotnet test DiskPerformanceAnalyzer.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish smoke test (single-file, self-contained)
        run: >
          dotnet publish src/DiskPerformanceAnalyzer -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
